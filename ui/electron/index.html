<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tino's Computer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="clock-container">
                <div id="time" class="time">12:00</div>
                <div id="date" class="date">Monday</div>
            </div>
            <div class="weather-container">
                <div class="weather-icon">☀️</div>
                <div class="temperature">72°</div>
            </div>
        </header>

        <main>
            <div class="app-grid">
                <div class="app-button" id="music-button">
                    <div class="app-icon">🎵</div>
                    <div class="app-label">Music</div>
                </div>
                <div class="app-button" id="stories-button">
                    <div class="app-icon">📚</div>
                    <div class="app-label">Stories</div>
                </div>
                <div class="app-button" id="games-button">
                    <div class="app-icon">🎮</div>
                    <div class="app-label">Games</div>
                </div>
                <div class="app-button" id="settings-button">
                    <div class="app-icon">⚙️</div>
                    <div class="app-label">Settings</div>
                </div>
            </div>
        </main>

        <!-- Music Player Section (initially hidden) -->
        <section id="music-player" class="section hidden">
            <div class="section-header">
                <button class="back-button">← Back</button>
                <h2>Music Player</h2>
            </div>
            <div class="music-content">
                <div class="album-art">
                    <img src="placeholder-album.png" alt="Album Art">
                </div>
                <div class="song-info">
                    <div class="song-title">Song Title</div>
                    <div class="artist">Artist</div>
                </div>
                <div class="player-controls">
                    <button id="prev-button">⏮️</button>
                    <button id="play-button">▶️</button>
                    <button id="pause-button" class="hidden">⏸️</button>
                    <button id="next-button">⏭️</button>
                </div>
            </div>
        </section>

        <!-- Stories Section (initially hidden) -->
        <section id="stories-section" class="section hidden">
            <div class="section-header">
                <button class="back-button">← Back</button>
                <h2>Stories</h2>
            </div>
            <div class="stories-grid">
                <div class="story-item">Story 1</div>
                <div class="story-item">Story 2</div>
                <div class="story-item">Story 3</div>
                <div class="story-item">Story 4</div>
            </div>
        </section>

        <!-- Games Section (initially hidden) -->
        <section id="games-section" class="section hidden">
            <div class="section-header">
                <button class="back-button">← Back</button>
                <h2>Games</h2>
            </div>
            <div class="games-grid">
                <div class="game-item">Game 1</div>
                <div class="game-item">Game 2</div>
                <div class="game-item">Game 3</div>
                <div class="game-item">Game 4</div>
            </div>
        </section>

        <!-- Settings Section (initially hidden) -->
        <section id="settings-section" class="section hidden">
            <div class="section-header">
                <button class="back-button">← Back</button>
                <h2>Settings</h2>
            </div>
            <div class="settings-content">
                <div class="pin-entry">
                    <h3>Enter PIN to access settings</h3>
                    <input type="password" id="pin-input" maxlength="4">
                    <div class="numpad">
                        <button class="num-button">1</button>
                        <button class="num-button">2</button>
                        <button class="num-button">3</button>
                        <button class="num-button">4</button>
                        <button class="num-button">5</button>
                        <button class="num-button">6</button>
                        <button class="num-button">7</button>
                        <button class="num-button">8</button>
                        <button class="num-button">9</button>
                        <button class="num-button clear">C</button>
                        <button class="num-button">0</button>
                        <button class="num-button enter">✓</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
